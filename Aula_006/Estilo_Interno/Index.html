<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8">
		<title>Estilo interno</title>
		<style>
			p {
				color:blue;
				font-size: 34 px;
				font-family: arial;
			}
			
			/*chamando classe por meio do ponto*/

				color:green;
			}

				color:pink;
			}

	</head>

		<p class="texto_rosa">Texto tres</p>
	</body>
</html>
