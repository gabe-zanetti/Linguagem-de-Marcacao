<!DOCTYPE html>
<html lang="pt-bR">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2- Table</title>
	</head>
	
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color:white" >
				<th>Cabeçalho 1</th>
				<th>Cabeçalho 2</th>
				<th>Cabeçalho 3</th>
			</tr>
			<tr>
				<td style="background-color:black; color:white" >Conteudo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:yellow;">1</td>
							<td style="background-color:red; color:white; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color:blue; color:white; text-align:right; ">3</td>
							<td style="background-color:greenyellow;">4</td>
						</tr>
					</table>
				</td>
				<td style="background-image: url('https://tse2.mm.bing.net/th/id/OIP.Ng0rs3w7BDs-aEunQtC7SQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3');">Conteudo 3</td>
			</tr>
			<tr>
				<td>Conteudo 4</td>
				<td style="background-image: url('https://th.bing.com/th/id/OIP.6mKorOTi3-iGGBeFXhgpiAHaE8?w=260&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3'); text-align:right;" >Conteudo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
						<td style="background-color:orange; text-align:center;" >5</td>
							<td style="background-color:pink;">6</td>
						</tr>
						<tr>
							<td style="background-color:red;" >7</td>
							<td style="background-color: orange; text-align:center">8</td>
						</tr>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
	
</html>
