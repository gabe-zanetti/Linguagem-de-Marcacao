<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<TITLE>Rowspan e Colspan</title>
	</head>
	<body>
		<table width="100%" height="100px">
			<tr>
				<td style="background-color:green;" rowspan="2">0</td>
				<td style="background-color:red;" rowspan="4">0</td>
				<td style="background-color:green;" rowspan="2">0</td>
				<td style="background-color:purple;" colspan="3">0</td>
				<td style="background-color:purple;" colspan="3">0</td>
			</tr>
			<tr>
				<td style="background-color:green;" colspan="2">0</td>
				<td style="background-color:green;" colspan="2">0</td>
				<td style="background-color: purple;" rowspan="5">0</td>
			</tr>
			<tr>
				<td style="background-color:purple;" colspan="3">0</td>
				<td style="background-color:purple;" colspan="3">0</td>
			</tr>
			<tr>
				<td style="background-color: pink;" colspan="7">0</td>
			</tr>
			<tr>
				<td style="background-color: red;" rowspan="4">0</td>
				<td style="background-color: green;">0</td>
				<td style="background-color: red;">0</td>
				<td style="background-color: teal;" rowspan="6">0</td>
				<td style="background-color: teal;" colspan="4">0</td>
			</tr>
			<tr>
				<td style="background-color: red;" rowspan="4">0</td>
				<td style="background-color:green;" rowspan="3">0</td>
				<td style="background-color: teal;" colspan="4">0</td>
			</tr>
			<tr>
				<td style="background-color: darkgreen;" colspan="2">0</td>
				<td style="background-color: yellow;" rowspan="2">0</td>
				<td style="background-color:yellow;" rowspan="2">0</td>
			</tr>
			<tr>
				<td style="background-color: green;">0</td>
				<td style="background-color: red;">0</td>
				<td style="background-color: darkgreen;">0</td>
				<td style="background-color:darkgreen;" rowspan="5">0</td>
			</tr>
		</table>
	</body>
<html>
